<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#4338ca" stroke-width="2.5"/>

  <!-- Network Interconnections Background -->
  <g opacity="0.35" stroke="#818cf8" stroke-width="1.2">
    <line x1="34" y1="36" x2="64" y2="28" />
    <line x1="64" y1="28" x2="94" y2="36" />
    <line x1="34" y1="36" x2="40" y2="68" />
    <line x1="94" y1="36" x2="88" y2="68" />
    <line x1="40" y1="68" x2="64" y2="84" />
    <line x1="88" y1="68" x2="64" y2="84" />
    <line x1="64" y1="28" x2="64" y2="84" />
  </g>

  <!-- Glowing Knowledge Brain / Graph Nodes -->
  <!-- Left Hemisphere -->
  <path d="M 60 32 C 48 32 36 38 34 50 C 30 54 28 62 32 70 C 34 76 40 82 48 84 C 54 86 58 82 60 80 Z" fill="none" stroke="url(#brainGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Right Hemisphere -->
  <path d="M 68 32 C 80 32 92 38 94 50 C 98 54 100 62 96 70 C 94 76 88 82 80 84 C 74 86 70 82 68 80 Z" fill="none" stroke="url(#brainGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Center Core Link -->
  <line x1="64" y1="38" x2="64" y2="76" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- Knowledge Nodes -->
  <circle cx="34" cy="50" r="4.5" fill="#c084fc" />
  <circle cx="94" cy="50" r="4.5" fill="#38bdf8" />
  <circle cx="48" cy="84" r="4.5" fill="#818cf8" />
  <circle cx="80" cy="84" r="4.5" fill="#818cf8" />
  <circle cx="64" cy="28" r="5" fill="url(#goldGrad)" />
  <circle cx="64" cy="56" r="6" fill="#ffffff" filter="url(#glow)" />

  <!-- Base Foundation Platform (Karpathy LLM Wiki Book) -->
  <path d="M 28 98 C 44 92 56 94 64 99 C 72 94 84 92 100 98 L 100 104 C 84 98 72 100 64 105 C 56 100 44 98 28 104 Z" fill="url(#goldGrad)" opacity="0.9"/>
</svg>
